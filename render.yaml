services:
  # Web Service for AfriClimate Analytics Dashboard
  - type: web
    name: africlimate-analytics
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.16
      - key: PORT
        value: 10000
    healthCheckPath: /
    autoDeploy: true
    
    # Environment variables (set these in Render dashboard)
    # AWS_ACCESS_KEY_ID
    # AWS_SECRET_ACCESS_KEY  
    # AWS_DEFAULT_REGION
    # DASH_DEBUG_MODE
    # DASH_HOST
