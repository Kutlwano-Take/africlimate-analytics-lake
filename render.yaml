services:
  # Web Service for AfriClimate Analytics Dashboard
  - type: web
    name: africlimate-analytics
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:server --workers 1 --threads 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.16
      - key: FORCE_FALLBACK_DATA
        value: "true"
      - key: DASH_DEBUG_MODE
        value: "false"
    healthCheckPath: /
    autoDeploy: true
    
    # Environment variables (set these in Render dashboard)
    # AWS_ACCESS_KEY_ID
    # AWS_SECRET_ACCESS_KEY  
    # AWS_DEFAULT_REGION
    # DASH_DEBUG_MODE
    # DASH_HOST
